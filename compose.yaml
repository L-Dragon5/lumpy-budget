# Development stays on the host: `bun run dev` against your own MySQL, unchanged.
# This file is how the same code runs on the homelab, where a Komodo Stack owns it
# (README, "Deploying with Komodo"). By hand, anywhere else:
#
#   cp .env.example .env && $EDITOR .env     # MYSQL_ROOT_PASSWORD and TZ are required
#   docker compose up -d --build
#   docker compose exec app bun run backup   # -> ./backups/
#
# The API serves apps/web/dist on its own port, so there is no second container
# and no internal proxy: apps/web/src/lib/api.ts talks to window.location.origin.
# Nginx Proxy Manager runs on another VM and forwards to <this host's IP>:3001
# -- see README, "Behind Nginx Proxy Manager".
services:
  db:
    # MariaDB, not MySQL, and 10.11 specifically: it is what every test and every
    # migration in this repo has ever run against (`select version()` on the dev
    # box). The two are close enough that swapping them looks free and is not --
    # they disagree about auth plugins, about what mysqldump emits, and about a
    # few things in information_schema.
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      # The image still reads the MYSQL_ prefix; .env keeps the familiar name.
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      # MySQL dates rows on its own clock while the app compares those dates to
      # its local today, so both containers have to agree and neither can be UTC
      # unless you are. On UTC, a row entered after 8pm local lands tomorrow.
      TZ: ${TZ:?set TZ in .env, e.g. America/New_York}
    volumes: ["dbdata:/var/lib/mysql"]
    # Loopback only. Published at all so a host `bun run dev` can point at this
    # database instead of a local install; 3307 to never collide with one, and a
    # variable so scripts/docker-smoke.sh can run beside the real stack.
    ports: ["127.0.0.1:${DB_PORT:-3307}:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    environment:
      # The password goes into a URL, so keep it alphanumeric or percent-encode it.
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/lumpy_budget
      TZ: ${TZ:?set TZ in .env, e.g. America/New_York}
      # Optional, both of them: without a key /api/classify answers 503 and the
      # Categorize page still works by hand.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    # Every interface: NPM is on another VM, so there is no Docker network to
    # share and the LAN is the only way in. Deliberate -- anyone on the LAN can
    # open the app directly, past NPM, and that is accepted. The database stays
    # loopback-only above.
    ports: ["${PORT:-3001}:3001"]
    volumes: ["./backups:/root/lumpy-backups"]
    depends_on:
      db:
        condition: service_healthy
    # "Up" is not "working": a blank app that cannot reach MariaDB still serves
    # index.html. So the question needs the database, and it is asked with bun
    # because the image has no curl. Komodo shows the result as the container's
    # health, which is the only thing that tells it a deploy did not take.
    # start_period covers migrations on boot. No start_interval: Engine 20.10.
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3001/api/categories'); process.exit(r.ok ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  dbdata:
